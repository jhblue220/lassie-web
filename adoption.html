  <!-- ===== Adoption hero ===== -->
  <section class="adopt-hero">
    <div class="adopt-colors" id="adoptColors">

      </button>
      <button class="color-dot-lg" type="button" data-color="yellow" data-label="Yellow" style="background:#d1cf29" aria-label="Yellow 선택">
        <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="color-dot-lg" type="button" data-color="navy" data-label="Navy" style="background:#232f42" aria-label="Navy 선택">
        <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="color-dot-lg" type="button" data-color="brown" data-label="Dark Brown" style="background:#3a2e2a" aria-label="Dark Brown 선택">
        <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <button class="color-dot-lg" type="button" data-color="pink" data-label="Pink" style="background:#f7c5cf" aria-label="Pink 선택">

    <img class="adopt-dog-img" src="assets/adoption-dog.png" alt="Lassie 로봇 강아지" />

    <div class="adopt-accessories">

  <!-- ===== Made to Move Together (색상 선택 후 노출) ===== -->
  <section class="adopt-reveal" id="adoptReveal">
    <div class="adopt-reveal-mask">
      <div class="adopt-reveal-content">
        <div class="adopt-move-col">
          <h2 class="adopt-move-title">Made to Move Together</h2>
          <p class="adopt-move-desc">
            당신과 래시는 활동적인 일상과 새로운 야외 경험을 즐긴다는 공통점을 가지고 있어요.
            함께 달리며 서로의 속도를 맞추고, 익숙한 길을 벗어나 새로운 장소를 탐색하며
            자연스럽게 더 많은 시간을 바깥에서 보내게 됩니다.
          </p>

          <div class="detail-tags adopt-tags">
            <span class="detail-tag">Cleaning</span>
            <span class="detail-tag">Charging</span>
            <span class="detail-tag">Modular Port</span>
            <span class="detail-tag active">Weatherproof</span>
          </div>

          <div class="detail-buy-row adopt-buy-row">
            <div class="qty-stepper detail-qty">
              <button type="button" class="qty-btn" id="adoptQtyMinus" aria-label="수량 감소">−</button>
              <span class="qty-val" id="adoptQtyVal">1</span>
              <button type="button" class="qty-btn" id="adoptQtyPlus" aria-label="수량 증가">+</button>
            </div>
            <button class="detail-add-cart" type="button" id="adoptAddCart">Add to Cart</button>
          </div>
        </div>

        <div class="adopt-move-media">
          <img src="assets/adoption-move-together.png" alt="래시 클로즈업" />
        </div>
      </div>
    </div>
  </section>

  <script src="assets/cart.js"></script>
  <script>
    // ---- 메뉴 드롭다운 ----
    const menuItem = document.querySelector('.menu-item');
    const menuToggle = document.querySelector('.menu-link-toggle');

    function closeSubmenu() {
      menuItem.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }

    menuToggle.addEventListener('click', () => {
      const isOpen = menuItem.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    function makeHoverPanel(triggerEl, panelEl, onOpen) {
      let closeTimer = null;
      function open() {
        clearTimeout(closeTimer);
        panelEl.classList.add('open');
        if (onOpen) onOpen();
      }
      function scheduleClose() {
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => panelEl.classList.remove('open'), 160);
      }
      triggerEl.addEventListener('mouseenter', open);
      triggerEl.addEventListener('mouseleave', scheduleClose);
      triggerEl.addEventListener('focus', open);
      triggerEl.addEventListener('blur', scheduleClose);
      panelEl.addEventListener('mouseenter', open);
      panelEl.addEventListener('mouseleave', scheduleClose);
      return { close: () => panelEl.classList.remove('open') };
    }

    const menuNavToggle = document.getElementById('menuNavToggle');
    const menuPanel = document.querySelector('.menu-panel');
    const searchToggle = document.getElementById('searchToggle');
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('searchInput');

    const menuPanelCtl = makeHoverPanel(menuNavToggle, menuPanel, () => searchPanelCtl.close());
    const searchPanelCtl = makeHoverPanel(searchToggle, searchPanel, () => {
      menuPanelCtl.close();
      closeSubmenu();
    });

    document.querySelector('.menu-close').addEventListener('click', () => {
      menuPanelCtl.close();
      closeSubmenu();
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchPanelCtl.close();
        searchToggle.blur();
      }
    });

    // ---- 색상 선택 -> Made to Move Together 공개 ----
    const LASSIE_PRICE = 2490000;
    const colorDots = document.querySelectorAll('.color-dot-lg');
    const adoptReveal = document.getElementById('adoptReveal');
    let selectedColor = null;
    let revealed = false;

    colorDots.forEach((dot) => {
      dot.addEventListener('click', () => {
        colorDots.forEach((d) => d.classList.remove('selected'));
        dot.classList.add('selected');
        selectedColor = { id: dot.dataset.color, label: dot.dataset.label };

        if (!revealed) {
          revealed = true;
          adoptReveal.classList.add('open');
          setTimeout(() => {
            adoptReveal.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 380);
        }
      });
    });

    // ---- 수량 ----
    let adoptQty = 1;
    const adoptQtyVal = document.getElementById('adoptQtyVal');
    document.getElementById('adoptQtyMinus').addEventListener('click', () => {
      adoptQty = Math.max(1, adoptQty - 1);
      adoptQtyVal.textContent = String(adoptQty);
    });
    document.getElementById('adoptQtyPlus').addEventListener('click', () => {
      adoptQty += 1;
      adoptQtyVal.textContent = String(adoptQty);
    });

    // ---- Add to Cart ----
    const adoptAddCart = document.getElementById('adoptAddCart');
    adoptAddCart.addEventListener('click', () => {
      if (!selectedColor) return;
      Cart.add({
        id: 'lassie-' + selectedColor.id,
        name: 'Lassie',
        price: LASSIE_PRICE,
        desc: 'Color: ' + selectedColor.label,
        color: selectedColor.label,
        image: 'assets/adoption-dog.png',
        qty: adoptQty,
      });
      const original = adoptAddCart.textContent;
      adoptAddCart.textContent = 'Added ✓';
      adoptAddCart.classList.add('added');
      setTimeout(() => {
        adoptAddCart.textContent = original;
        adoptAddCart.classList.remove('added');
      }, 1200);
    });
  </script>
</body>
