                <img class="menu-group-ic" src="Icon/Menu_i_icon.png" alt="" aria-hidden="true" draggable="false" />

        </div>
      </div>
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <img class="ic" src="Icon/Icon_SVG/Main_Carticon.svg" alt="" aria-hidden="true" draggable="false" />
        <span class="cart-badge" id="cartBadge"></span>

  <!-- ===== Studio: 360 뷰어 ===== -->
  <section class="adopt-studio entered" id="adoptStudio">
    <div class="adopt-hero">
      <h1 class="adopt-lassie-title">Lassie</h1>

      <div class="adopt-cols">
        <!-- 좌: 소개 · 태그 · 컬러 · 구매 -->
        <div class="adopt-left">
          <p class="adopt-lassie-sub">The New Compaionship.<br />Buy from ₩2,490,000 or ₩103,750/mo. for 24 mo.</p>
          <div class="adopt-rule"></div>

          <div class="detail-tags adopt-tags">
            <span class="detail-tag">Cleaning</span>
            <span class="detail-tag">Leg Variation</span>
            <span class="detail-tag">Modular Port</span>
            <span class="detail-tag">Waterproof</span>
          </div>

          <div class="adopt-bottom">
            <div class="studio-colors" id="studioColors">
          <button class="color-dot-lg selected" type="button" data-color="gray" data-label="Gray" aria-label="Gray 선택">
            <img class="dot-swatch" src="assets/lassie_turn/Gray_color.svg" alt="" draggable="false" />
            <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#433E38" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="color-dot-lg" type="button" data-color="beige" data-label="Beige" aria-label="Beige 선택">
            <img class="dot-swatch" src="assets/lassie_turn/Beige_color.svg" alt="" draggable="false" />
            <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#433E38" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="color-dot-lg" type="button" data-color="green" data-label="Green" aria-label="Green 선택">
            <img class="dot-swatch" src="assets/lassie_turn/Green_color.svg" alt="" draggable="false" />
            <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#433E38" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="color-dot-lg" type="button" data-color="indigo" data-label="Indigo" aria-label="Indigo 선택">
            <img class="dot-swatch" src="assets/lassie_turn/Indigo_color.svg" alt="" draggable="false" />
            <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="color-dot-lg" type="button" data-color="black" data-label="Black" aria-label="Black 선택">
            <img class="dot-swatch" src="assets/lassie_turn/Black_color.svg" alt="" draggable="false" />
            <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
            </div>
            <div class="adopt-rule"></div>
            <div class="detail-buy-row adopt-buy-row">
              <div class="qty-stepper detail-qty">
                <button type="button" class="qty-btn" id="adoptQtyMinus" aria-label="수량 감소">−</button>
                <span class="qty-val" id="adoptQtyVal">1</span>
                <button type="button" class="qty-btn" id="adoptQtyPlus" aria-label="수량 증가">+</button>
              </div>
              <button class="detail-add-cart" type="button" id="adoptAddCart">Choose a Plan</button>
            </div>
          </div>
        </div>

        <!-- 중앙: 360 턴테이블 -->
        <div class="adopt-center">
          <div class="turn-viewport" id="turnViewport">
            <img id="turnImg" src="assets/lassie_turn/Gray_Turn/0330.bip.276.1.png" alt="Lassie 360도 보기" draggable="false" />
          </div>
          <img class="adopt-360" src="Icon/Icon_SVG/Adoption_360.svg" alt="360도 회전" draggable="false" />
        </div>

        <!-- 우: 이미지 박스 4개 -->
        <div class="adopt-boxes" aria-hidden="true">
          <span class="adopt-box"></span>
          <span class="adopt-box"></span>
          <span class="adopt-box"></span>
          <span class="adopt-box"></span>
        </div>
      </div>
    </div>

  </section>


  <script src="assets/cart.js"></script>
  <script>
    // ---- 메뉴 드롭다운 ----
    const menuItem = document.querySelector('.menu-item');
    const menuToggle = document.querySelector('.menu-link-toggle');
    const menuWrap = document.querySelector('.menu-wrap');
    const menuNavToggle = document.getElementById('menuNavToggle');
    const menuPanel = document.querySelector('.menu-panel');
    const searchToggle = document.getElementById('searchToggle');
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('searchInput');

    function closeSubmenu() {
      menuItem.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }
    function closeMenu() {
      menuPanel.classList.remove('open');
      closeSubmenu();
    }
    function closeSearch() {
      searchPanel.classList.remove('open');
    }

    // Shop 아코디언 (V자는 열렸을 때만 위를 향해 노출)
    menuToggle.addEventListener('click', () => {
      const isOpen = menuItem.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    // Menu: 클릭하면 열리고, X 또는 바깥 영역 클릭 전까지 유지
    menuNavToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (menuPanel.classList.contains('open')) {
        closeMenu();
      } else {
        menuPanel.classList.add('open');
        closeSearch();
      }
    });

    // 검색: 클릭 토글
    searchToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (searchPanel.classList.contains('open')) {
        closeSearch();
      } else {
        searchPanel.classList.add('open');
        closeMenu();
        searchInput.focus();
      }
    });

    // 팝업 창의 X(닫기) 버튼
    document.querySelector('.menu-close').addEventListener('click', closeMenu);

    // About 클릭 시에도 열린 팝업 닫기
    const navAbout = document.querySelector('.nav-about');
    if (navAbout) navAbout.addEventListener('click', () => { closeMenu(); closeSearch(); });

    // 팝업 바깥(메뉴 영역 밖)을 클릭하면 닫기
    document.addEventListener('click', (e) => {
      if (!menuWrap.contains(e.target)) {
        closeMenu();
        closeSearch();
      }
    });

    // ESC로 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
        closeSearch();
        searchToggle.blur();
      }
    });



    const LASSIE_PRICE = 2490000;

    // Plans에서 선택한 플랜 불러오기 → 금액·하단 표시에 사용
    let selectedPlan = null;
    try { selectedPlan = JSON.parse(localStorage.getItem('lassie_plan') || 'null'); } catch (e) {}
    // 선택한 플랜은 이 화면에 표시하지 않고, 장바구니 담기에만 반영한다
    // 진입 즉시 360 프레임 프리로드
    window.addEventListener('load', () => preloadFrames('gray'));


    // ---- 360 턴테이블 뷰어 ----
    // 색상별 프레임 세트: 새 색상이 나오면 여기에 추가하면 됨
    // 색상별 프레임 세트 (Adoption_Lassie_Turn 폴더명·파일명 그대로 반영)
    const TURN_SETS = {
      gray:   { dir: 'assets/lassie_turn/Gray_Turn',   prefix: '0330.bip.276.', count: 12 },
      beige:  { dir: 'assets/lassie_turn/Beige_Turn',  prefix: '0330.bip.287.', count: 12 },
      green:  { dir: 'assets/lassie_turn/Green_Turn',  prefix: '0330.bip.280.', count: 12 },
      indigo: { dir: 'assets/lassie_turn/Indigo_Turn', prefix: '0330.bip.278.', count: 12 },
      black:  { dir: 'assets/lassie_turn/Black_Turn',  prefix: '0330.bip.279.', count: 12 },
    };

    const turnImg = document.getElementById('turnImg');
    const turnViewport = document.getElementById('turnViewport');
    let turnColor = 'gray';
    let frameIndex = 0; // 0-based
    const preloaded = {};

    function framePath(color, i) {
      const set = TURN_SETS[color];
      return `${set.dir}/${set.prefix}${i + 1}.png`;   // 파일명은 1-based (0330.bip.XXX.N.png)
    }

    function preloadFrames(color) {
      if (preloaded[color]) return;
      preloaded[color] = true;
      const set = TURN_SETS[color];
      for (let i = 0; i < set.count; i++) {
        const im = new Image();
        im.src = framePath(color, i);
      }
    }

    function showFrame() {
      const set = TURN_SETS[turnColor];
      const n = set.count;
      const idx = ((Math.round(frameIndex) % n) + n) % n;
      turnImg.src = framePath(turnColor, idx);
    }

    // 드래그 회전: 프레임 번호가 커질수록 코가 왼쪽으로 도므로,
    // 왼쪽으로 밀면(deltaX<0) 프레임이 증가해 미는 방향과 회전이 일치함
    const DRAG_PX_PER_FRAME = 30;   // 프레임이 12장(≈30°/장)이라 감도 완화
    let dragging = false;
    let dragStartX = 0;
    let dragStartFrame = 0;

    turnViewport.addEventListener('pointerdown', (e) => {
      dragging = true;
      dragStartX = e.clientX;
      dragStartFrame = frameIndex;
      turnViewport.classList.add('grabbing');
      turnViewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    turnViewport.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX;
      frameIndex = dragStartFrame - dx / DRAG_PX_PER_FRAME;
      showFrame();
    });

    function endDrag() {
      dragging = false;
      turnViewport.classList.remove('grabbing');
    }
    turnViewport.addEventListener('pointerup', endDrag);
    turnViewport.addEventListener('pointercancel', endDrag);

    // ---- 색상 도트: 선택 시 같은 회전 각도에서 해당 색상 모델로 교체 ----
    const colorDots = document.querySelectorAll('.color-dot-lg');
    // 장바구니용: 색상별 11번 프레임 이미지 + 스와치 컬러 코드
    const CART_IMG = {
      gray:   'assets/lassie_turn/Gray_Turn/0330.bip.276.11.png',
      beige:  'assets/lassie_turn/Beige_Turn/0330.bip.287.11.png',
      green:  'assets/lassie_turn/Green_Turn/0330.bip.280.11.png',
      indigo: 'assets/lassie_turn/Indigo_Turn/0330.bip.278.11.png',
      black:  'assets/lassie_turn/Black_Turn/0330.bip.279.11.png',
    };
    const CART_HEX = { gray: 'E5E4E4', beige: 'A98F72', green: 'BFC392', indigo: '525F74', black: '5C5C5D' };

    let selectedColor = { id: 'gray', label: 'Gray' };

    colorDots.forEach((dot) => {
      dot.addEventListener('click', () => {
        colorDots.forEach((d) => d.classList.remove('selected'));
        dot.classList.add('selected');
        selectedColor = { id: dot.dataset.color, label: dot.dataset.label };

        // 해당 색상의 프레임 세트가 있으면 교체, 없으면 Gray 유지
        turnColor = TURN_SETS[selectedColor.id] ? selectedColor.id : 'gray';
        preloadFrames(turnColor);
        showFrame();
      });
    });

    // ---- 수량 ----
    let adoptQty = 1;
    const adoptQtyVal = document.getElementById('adoptQtyVal');
    document.getElementById('adoptQtyMinus').addEventListener('click', () => {
      adoptQty = Math.max(1, adoptQty - 1);
      adoptQtyVal.textContent = String(adoptQty);
    });
    document.getElementById('adoptQtyPlus').addEventListener('click', () => {
      adoptQty += 1;
      adoptQtyVal.textContent = String(adoptQty);
    });

    // ---- Add to Cart ----
    const adoptAddCart = document.getElementById('adoptAddCart');
    adoptAddCart.addEventListener('click', () => {
      // Choose a Plan: 선택한 색상을 담고 Plans 페이지로 이동
      if (selectedColor) {
        Cart.add({
          id: 'lassie-' + selectedColor.id,
          name: 'Lassie',
          price: LASSIE_PRICE,
          desc: 'Color: ' + selectedColor.label,
          color: selectedColor.label,
          colorCode: CART_HEX[selectedColor.id] || '',
          image: CART_IMG[selectedColor.id] || CART_IMG.gray,
          qty: adoptQty,
        });
      }
      window.location.href = 'plans.html';
    });
  </script>
</body>
</html>
