  <!-- ===== Archiving ===== -->
  <h1 class="archive-title">Archiving</h1>

  <section class="words-strip">
    <span class="word">Life</span>
    <span class="word">Moves</span>
    <span class="word">Better</span>
    <span class="word">Together</span>
    <span class="word word-index">Index</span>
  </section>

  <section class="archive-carousel">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-slot slot-prev" id="slotPrev">
        <img id="prevImg" src="" alt="이전 이미지" />
      </div>
      <div class="carousel-slot slot-current">
        <img id="currentImg" src="" alt="" />
      </div>
      <div class="carousel-slot slot-next" id="slotNext">
        <img id="nextImg" src="" alt="다음 이미지" />
      </div>
    </div>
    <p class="carousel-caption" id="carouselCaption"></p>
  </section>

  <script>
    const menuWrap = document.querySelector('.menu-wrap');
    const menuItem = document.querySelector('.menu-item');
    const menuToggle = document.querySelector('.menu-link-toggle');

    function closeSubmenu() {
      menuItem.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }

    menuToggle.addEventListener('click', () => {
      const isOpen = menuItem.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    document.querySelector('.menu-close').addEventListener('click', () => {
      menuWrap.classList.add('menu-dismissed');
      closeSubmenu();
    });
    menuWrap.addEventListener('mouseleave', () => {
      menuWrap.classList.remove('menu-dismissed');
      closeSubmenu();
    });

    // ---- Archiving carousel ----
    const images = [
      { file: 'Interview_01.png', title: 'Interview 01' },
      { file: 'Interview_02.png', title: 'Interview 02' },
      { file: 'Research_01.png', title: 'Research 01' },
      { file: 'Research_02.png', title: 'Research 02' },
      { file: 'Fabric Research_01.png', title: 'Fabric Research 01' },
      { file: 'Fabric Research_02.png', title: 'Fabric Research 02' },
      { file: 'Fabric Research_03.png', title: 'Fabric Research 03' },
      { file: 'Mock_Up_01.png', title: 'Mock Up 01' },
      { file: 'Mock_Up_02.png', title: 'Mock Up 02' },
      { file: 'Mock_Up_03.png', title: 'Mock Up 03' },
      { file: 'Scale_01.png', title: 'Scale 01' },
    ];

    const track = document.getElementById('carouselTrack');
    const prevImg = document.getElementById('prevImg');
    const currentImg = document.getElementById('currentImg');
    const nextImg = document.getElementById('nextImg');
    const caption = document.getElementById('carouselCaption');

    let current = 0;
    let locked = false;

    function photoPath(file) {
      return 'archive_photo/' + encodeURIComponent(file);
    }

    function applyImages() {
      const n = images.length;
      const prevIdx = (current - 1 + n) % n;
      const nextIdx = (current + 1) % n;
      prevImg.src = photoPath(images[prevIdx].file);
      currentImg.src = photoPath(images[current].file);
      nextImg.src = photoPath(images[nextIdx].file);
      caption.textContent = images[current].title;
    }

    function go(delta) {
      if (locked) return;
      locked = true;
      track.style.opacity = '0';
      setTimeout(() => {
        current = (current + delta + images.length) % images.length;
        applyImages();
        track.style.opacity = '1';
      }, 180);
      setTimeout(() => { locked = false; }, 420);
    }

    applyImages();

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (Math.abs(e.deltaY) < 4) return;
      go(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    });

    document.getElementById('slotPrev').addEventListener('click', () => go(-1));
    document.getElementById('slotNext').addEventListener('click', () => go(1));
  </script>
</body>
