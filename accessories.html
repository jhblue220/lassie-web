<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessories — Lassie</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="shop-page">

  <!-- ===== Header ===== -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <img class="logo-symbol" src="Logo/SymbolLogo.svg" alt="Lassie 홈" draggable="false" />
    </a>

    <div class="header-right">
      <div class="menu-wrap">
        <nav class="nav-pill">
          <button class="nav-item" type="button" id="menuNavToggle">
            Shop
            <img class="ic" src="Icon/Icon_SVG/Shop_Icon.svg" alt="" aria-hidden="true" draggable="false" />
          </button>
          <span class="nav-divider"></span>
          <button class="nav-item nav-search" type="button" id="searchToggle" aria-label="Search">
            <img class="ic" src="Icon/Icon_SVG/Menu_Searching.svg" alt="" aria-hidden="true" draggable="false" />
          </button>
          <button class="nav-item nav-about" type="button">About</button>

          <div class="search-panel" id="searchPanel">
            <div class="search-panel-mask">
              <div class="search-pill">
                <svg class="search-pill-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
                  <path d="M13.5 13.5 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="text" class="search-pill-input" id="searchInput" placeholder="searching" autocomplete="off" />
              </div>
            </div>
          </div>
        </nav>

        <div class="menu-panel">
          <div class="menu-panel-inner">
            <div class="menu-panel-content">
              <button class="menu-close" type="button" aria-label="Close menu">
                <img class="menu-close-ic" src="Icon/Icon_SVG/Menu_X_icon.svg" alt="" aria-hidden="true" draggable="false" />
              </button>
              <div class="menu-group">
                <img class="menu-group-ic" src="Icon/Icon_SVG/Menu_Menuicon.svg" alt="" aria-hidden="true" draggable="false" />
                <div class="menu-item">
                  <button class="menu-link menu-link-toggle" type="button" aria-expanded="false">
                    Shop
                    <img class="menu-chevron" src="Icon/Icon_SVG/Menu_Shop_Downsign.svg" alt="" aria-hidden="true" draggable="false" />
                  </button>
                  <div class="submenu">
                    <div class="submenu-inner">
                      <a class="submenu-link" href="adoption.html">Adoption</a>
                      <a class="submenu-link" href="accessories.html">Accessories</a>
                    </div>
                  </div>
                </div>
                <a class="menu-link" href="club.html">Club</a>
                <a class="menu-link" href="plans.html">Plans</a>
              </div>
              <div class="menu-group">
                <img class="menu-group-ic" src="Icon/Menu_i_icon.png" alt="" aria-hidden="true" draggable="false" />
                <a class="menu-link" href="faq.html">FAQ</a>
                <a class="menu-link" href="archive.html">Archive</a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <img class="ic" src="Icon/Icon_SVG/Main_Carticon.svg" alt="" aria-hidden="true" draggable="false" />
        <span class="cart-badge" id="cartBadge"></span>
      </a>
      <a class="icon-btn" href="profile.html" aria-label="Account">
        <img class="ic" src="Icon/Icon_SVG/Profile_Icon.svg" alt="" aria-hidden="true" draggable="false" />
      </a>
    </div>
  </header>

  <!-- ===== Shop layout ===== -->
  <div class="shop-layout">

    <!-- Sidebar -->
    <aside class="shop-sidebar">
      <div class="filter-head">
        <h2 class="filter-title">Accessories</h2>
        <svg viewBox="0 0 18 14" class="filter-ic" aria-hidden="true">
          <path d="M1 2h16M1 7h16M1 12h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <nav class="filter-links" id="catFilters">
        <button class="filter-link active" type="button" data-cat="all">All</button>
        <button class="filter-link" type="button" data-cat="home">Home</button>
        <button class="filter-link" type="button" data-cat="outdoor">Outdoor</button>
        <button class="filter-link" type="button" data-cat="protection">Protection</button>
      </nav>

      <div class="filter-section">
        <svg viewBox="0 0 14 8" class="filter-chevron" aria-hidden="true">
          <path d="M1 7 7 1.4 13 7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3 class="filter-subtitle">Price</h3>
        <div class="price-slider">
          <div class="price-track"><span class="price-fill"></span></div>
          <div class="price-labels">
            <span>₩20,000</span>
            <span>₩100,000</span>
          </div>
        </div>
      </div>

      <div class="filter-section filter-style">
        <div class="filter-subhead">
          <h3 class="filter-subtitle">Style</h3>
          <svg viewBox="0 0 14 8" class="filter-chevron-r" aria-hidden="true">
            <path d="M1 7 7 1.4 13 7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <nav class="filter-links filter-links-light">
          <a class="filter-link" href="#">Trail</a>
          <a class="filter-link" href="#">Running</a>
          <a class="filter-link" href="#">City Walk</a>
          <a class="filter-link" href="#">Weekend Escape</a>
        </nav>
      </div>

      <button class="btn-apply" type="button">Apply Filter</button>
    </aside>

    <!-- Main -->
    <main class="shop-main">
      <h1 class="shop-title">Accessories</h1>

      <div class="shop-meta">
        <button class="tryon-btn" id="tryOnBtn" type="button">Try on</button>
        <div class="shop-meta-right">
          <span class="shop-count">Showing 1-8 of 8 Products</span>
          <span class="shop-sort">
            Sort by: <strong>Most Popular</strong>
            <svg viewBox="0 0 14 8" class="sort-chevron" aria-hidden="true">
              <path d="M1 1 7 6.6 13 1" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="product-grid" id="productGrid"></div>

      <!-- Pagination -->
      <nav class="pagination" aria-label="페이지 이동">
        <a class="page-prev" href="#">
          <svg viewBox="0 0 20 14" class="page-arrow" aria-hidden="true">
            <path d="M8 1 2 7l6 6M2 7h17" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Previous
        </a>
        <div class="page-numbers">
          <a class="page-num current" href="#">1</a>
        </div>
        <a class="page-next" href="#">
          Next
          <svg viewBox="0 0 20 14" class="page-arrow" aria-hidden="true">
            <path d="m12 1 6 6-6 6M18 7H1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </nav>
    </main>
  </div>

  <!-- ===== Product detail slide-in ===== -->
  <div class="detail-overlay" id="detailOverlay" aria-hidden="true">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <button class="detail-back" type="button" id="detailBack" aria-label="닫기">
      <img class="detail-back-ic" src="Icon/Icon_SVG/Accessories_Rightside_White.svg" alt="" aria-hidden="true" draggable="false" />
    </button>
    <aside class="detail-panel" role="dialog" aria-modal="true" aria-label="상품 상세">
      <div class="detail-scroll">
        <nav class="breadcrumb detail-crumb">
          <a href="index.html">Home</a>
          <svg viewBox="0 0 8 12" class="crumb-arrow" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <a href="accessories.html">Shop</a>
          <svg viewBox="0 0 8 12" class="crumb-arrow" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="crumb-current">Accessories</span>
        </nav>

        <div class="detail-columns">
          <div class="detail-media-col">
            <div class="detail-media" id="detailMedia1"></div>
            <div class="detail-media" id="detailMedia2"></div>
          </div>

          <div class="detail-info-col">
            <h2 class="detail-name" id="detailName"></h2>
            <p class="detail-watchers">
              <svg viewBox="0 0 20 14" aria-hidden="true"><path d="M1 7s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><circle cx="10" cy="7" r="2.6" fill="currentColor"/></svg>
              현재 <span id="detailWatchers"></span>명이 함께 보고 있어요.
            </p>

            <p class="detail-price" id="detailPrice"></p>
            <p class="detail-desc" id="detailDesc"></p>

            <p class="detail-colors-label">Select Colors</p>
            <div class="detail-colors" id="detailColors"></div>

            <div class="detail-tags" id="detailTags"></div>

            <div class="detail-buy-row">
              <div class="qty-stepper detail-qty">
                <button type="button" class="qty-btn" id="detailQtyMinus" aria-label="수량 감소">−</button>
                <span class="qty-val" id="detailQtyVal">1</span>
                <button type="button" class="qty-btn" id="detailQtyPlus" aria-label="수량 증가">+</button>
              </div>
              <button class="detail-add-cart" type="button" id="detailAddCart">Add to Cart</button>
            </div>

            <h3 class="detail-also-title">You might<br />also like</h3>
            <div class="detail-also" id="detailAlso"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>


  <script src="assets/cart.js"></script>
  <script>
    // ---- 제품 데이터 (Accessories 폴더 기반) ----
    const IMGROOT = 'assets/acc2';
    const won = (n) => '₩' + n.toLocaleString('ko-KR');
    const imgP = (num, file) => `${IMGROOT}/${num}/${file}`;
    function isDark(hex) {
      const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) < 140;
    }
    // 컬러 코드는 단일('6B6B6B') 또는 2색('575551-C3BF54')
    // 2색이면 원을 가로로 반 나눠 위=첫 색, 아래=둘째 색
    function chipStyle(code) {
      const p = String(code).split('-');
      return p.length > 1
        ? `background:linear-gradient(to bottom, #${p[0]} 0 50%, #${p[1]} 50% 100%)`
        : `background:#${p[0]}`;
    }
    const isDarkCode = (code) => isDark(String(code).split('-')[0]);
    const priceText = (p) => won(p.price) + (p.priceSuffix || '');

    const PRODUCTS = [
      { num: 1, id: 'cleaning-pad',   name: 'Cleaning Pad',           price: 69000,  colors: ['6B6B6B','D1CF29'],
        story: 'Lassie의 발의 굴곡에 맞게 외부 오염을 털어낼 수 있는 풋 클리닝 패드입니다.', notes: [] },
      { num: 2, id: 'charging-bed',   name: 'Charging Bed',           price: 149000, colors: ['74A5A9','AEAEAE'],
        story: 'Lassie가 편안하게 기대 충전을 할 수 있는 패브릭 소재의 충전 베드입니다.', notes: ['충전부 분리 가능'] },
      { num: 3, id: 'running-set',    name: 'Running Set',            price: 69000,  colors: ['575551-C3BF54','A9A7AA-75BFBB'],
        story: '러닝 시 필요한 물병과 휴대폰 등 간단한 소지품을 휴대할 수 있는 러닝 베스트입니다.', notes: ['하네스 탈부착 가능', '마그네틱 등판 결합'] },
      { num: 4, id: 'battery-pack',   name: 'Extended Battery Pack',  price: 149000, colors: ['3F3A39-FFCAD0','D6D2CD-D7E145'],
        story: '장시간의 야외 활동을 위해 추가 전력을 공급하며, Lassie의 바디에 안정적으로 장착할 수 있도록 설계된 보조 배터리 팩입니다.', notes: [] },
      { num: 5, id: 'companion-leash', name: 'Companion Leash',       price: 29000,  colors: ['434342','845240','B0A49B'],
        story: 'Lassie와 나란히 걷는 경험을 위한 리드로, 등판의 전용 고리에 간편하게 연결할 수 있습니다.', notes: [] },
      { num: 6, id: 'rain-coat',      name: 'Rain Coat',              price: 89000,  colors: ['363635','897A5E'],
        story: '비 오는 날에도 함께할 수 있도록, 패브릭 바디를 빗물과 오염으로부터 보호하는 전용 우비입니다.', notes: [] },
      { num: 7, id: 'trail-vest',     name: 'Trail Vest',             price: 89000,  colors: ['363635','5B534C','6F6C55'],
        story: '하이킹과 트레일에 필요한 장비를 안정적으로 휴대할 수 있는 기능성 베스트입니다.', notes: [] },
      { num: 8, id: 'activity-legwear', name: 'Activity Legwear',     price: 45000,  colors: ['B5B4B5','C3BF54'], priceSuffix: ' / 4P SET',
        story: '액티비티에 착용하기 좋은 레그웨어로, 하단 레그를 오염과 스크래치로부터 보호합니다.', notes: [] },
    ];

    // ---- 그리드 렌더 (처음엔 01_Basic) ----
    // 카테고리: Home=01·02, Outdoor=03·04·05·07, Protection=06·08
    const CATS = { home: [1, 2], outdoor: [3, 4, 5, 7], protection: [6, 8] };
    const grid = document.getElementById('productGrid');
    const shopCount = document.querySelector('.shop-count');

    function renderGrid(list) {
      grid.innerHTML = list.map((p) => `
      <article class="product" data-id="${p.id}">
        <div class="product-media">
          <img class="product-img p-basic is-on" src="${imgP(p.num, '01.jpg')}" alt="${p.name}" />
          <img class="product-img p-tryon" src="${imgP(p.num, '02.jpg')}" alt="${p.name} 착용" />
        </div>
        <h3 class="product-name">${p.name}</h3>
        <p class="product-price">${priceText(p)}</p>
      </article>`).join('');
      if (shopCount) shopCount.textContent = `Showing 1-${list.length} of ${list.length} Products`;
      setGridImages(triedOn);          // 현재 Try on 상태 유지
      bindProductClicks();
    }

    const catalog = PRODUCTS;
    let triedOn = false;

    // ---- Try on / Take off: 버튼 색상만 바뀌고 이미지 교체 ----
    const tryOnBtn = document.getElementById('tryOnBtn');

    function setGridImages(tryon) {
      // 이전 이미지 fade out / 이후 이미지 fade in (CSS transition)
      document.querySelectorAll('.p-basic').forEach((img) => img.classList.toggle('is-on', !tryon));
      document.querySelectorAll('.p-tryon').forEach((img) => img.classList.toggle('is-on', tryon));
    }
    tryOnBtn.addEventListener('click', () => {
      triedOn = !triedOn;
      setGridImages(triedOn);
      tryOnBtn.textContent = triedOn ? 'Take off' : 'Try on';
      tryOnBtn.classList.toggle('active', triedOn);
    });

    const overlay = document.getElementById('detailOverlay');
    const detailEls = {
      name: document.getElementById('detailName'),
      watchers: document.getElementById('detailWatchers'),
      price: document.getElementById('detailPrice'),
      desc: document.getElementById('detailDesc'),
      colors: document.getElementById('detailColors'),
      tags: document.getElementById('detailTags'),
      qtyVal: document.getElementById('detailQtyVal'),
      addCart: document.getElementById('detailAddCart'),
      also: document.getElementById('detailAlso'),
    };

    let detailCurrent = null;
    let detailQty = 1;
    let detailColor = null;   // 상세에서 선택 중인 컬러 코드

    function openDetail(id) {
      const item = catalog.find((c) => c.id === id);
      if (!item) return;
      detailCurrent = item;
      detailQty = 1;
      detailEls.qtyVal.textContent = '1';

      detailEls.name.innerHTML = item.name.replace(' ', '<br />');
      detailEls.watchers.textContent = 12 + Math.floor(Math.random() * 70);
      detailEls.price.textContent = priceText(item);
      detailEls.desc.innerHTML = item.story
        + ((item.notes && item.notes.length)
            ? '<span class="detail-notes">' + item.notes.map((t) => '· ' + t).join('<br />') + '</span>'
            : '');

      // 색상 칩 = 제품 실제 색상, 선택 시 03·04 이미지 팝업 교체
      const media1 = document.getElementById('detailMedia1');
      const media2 = document.getElementById('detailMedia2');
      function applyColor(c) {
        detailColor = c;
        media1.innerHTML = `<img src="${imgP(item.num, '03_' + c + '.jpg')}" alt="${item.name}" />`;
        media2.innerHTML = `<img src="${imgP(item.num, '04_' + c + '.jpg')}" alt="${item.name}" />`;
      }
      detailEls.colors.innerHTML = item.colors.map((c, i) => {
        const stroke = isDarkCode(c) ? '#fff' : '#1e2a3d';
        return `<button type="button" class="color-dot${i === 0 ? ' selected' : ''}" style="${chipStyle(c)}" data-color="${c}" aria-label="색상 ${c}">
          <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.2 4.4 8.6 11 1.4" stroke="${stroke}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>`;
      }).join('');
      applyColor(item.colors[0]);
      detailEls.colors.querySelectorAll('.color-dot').forEach((dot) => {
        dot.addEventListener('click', () => {
          detailEls.colors.querySelectorAll('.color-dot').forEach((d) => d.classList.remove('selected'));
          dot.classList.add('selected');
          applyColor(dot.dataset.color);
        });
      });

      detailEls.tags.style.display = 'none';

      const others = catalog.filter((c) => c.id !== id).slice(0, 2);
      detailEls.also.innerHTML = others.map((o) => `
        <button type="button" class="also-card" data-id="${o.id}">
          <span class="also-media" style="background-image:url('${imgP(o.num, '01.jpg')}')"></span>
          <span class="also-name">${o.name}</span>
          <span class="also-price">${priceText(o)}</span>
        </button>`).join('');
      detailEls.also.querySelectorAll('.also-card').forEach((card) => {
        card.addEventListener('click', () => openDetail(card.dataset.id));
      });

      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('detail-open');
      overlay.querySelector('.detail-scroll').scrollTop = 0;
    }

    function closeDetail() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('detail-open');
    }

    function bindProductClicks() {
      document.querySelectorAll('.product').forEach((product) => {
        product.querySelector('.product-media').addEventListener('click', () => openDetail(product.dataset.id));
      });
    }

    // 초기 렌더 + 카테고리 필터
    renderGrid(PRODUCTS);
    document.querySelectorAll('#catFilters .filter-link').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#catFilters .filter-link').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        renderGrid(cat === 'all' ? PRODUCTS : PRODUCTS.filter((p) => CATS[cat].includes(p.num)));
      });
    });

    document.getElementById('detailBackdrop').addEventListener('click', closeDetail);
    document.getElementById('detailBack').addEventListener('click', closeDetail);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeDetail();
    });

    document.getElementById('detailQtyMinus').addEventListener('click', () => {
      detailQty = Math.max(1, detailQty - 1);
      detailEls.qtyVal.textContent = String(detailQty);
    });
    document.getElementById('detailQtyPlus').addEventListener('click', () => {
      detailQty += 1;
      detailEls.qtyVal.textContent = String(detailQty);
    });

    detailEls.addCart.addEventListener('click', () => {
      if (!detailCurrent) return;
      Cart.add({
        id: detailCurrent.id + (detailColor ? '-' + detailColor : ''),
        name: detailCurrent.name,
        price: detailCurrent.price,
        desc: detailCurrent.name,
        color: Cart.colorLabel(detailColor),
        colorCode: detailColor || '',
        image: imgP(detailCurrent.num, detailColor ? ('03_' + detailColor + '.jpg') : '01.jpg'),
        qty: detailQty,
      });
      detailEls.addCart.textContent = 'Added ✓';
      detailEls.addCart.classList.add('added');
      setTimeout(() => {
        detailEls.addCart.textContent = 'Add to Cart';
        detailEls.addCart.classList.remove('added');
      }, 1200);
    });

    const menuItem = document.querySelector('.menu-item');
    const menuToggle = document.querySelector('.menu-link-toggle');
    const menuWrap = document.querySelector('.menu-wrap');
    const menuNavToggle = document.getElementById('menuNavToggle');
    const menuPanel = document.querySelector('.menu-panel');
    const searchToggle = document.getElementById('searchToggle');
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('searchInput');

    function closeSubmenu() {
      menuItem.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }
    function closeMenu() {
      menuPanel.classList.remove('open');
      closeSubmenu();
    }
    function closeSearch() {
      searchPanel.classList.remove('open');
    }

    // Shop 아코디언 (V자는 열렸을 때만 위를 향해 노출)
    menuToggle.addEventListener('click', () => {
      const isOpen = menuItem.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    // Menu: 클릭하면 열리고, X 또는 바깥 영역 클릭 전까지 유지
    menuNavToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (menuPanel.classList.contains('open')) {
        closeMenu();
      } else {
        menuPanel.classList.add('open');
        closeSearch();
      }
    });

    // 검색: 클릭 토글
    searchToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (searchPanel.classList.contains('open')) {
        closeSearch();
      } else {
        searchPanel.classList.add('open');
        closeMenu();
        searchInput.focus();
      }
    });

    // 팝업 창의 X(닫기) 버튼
    document.querySelector('.menu-close').addEventListener('click', closeMenu);

    // About 클릭 시에도 열린 팝업 닫기
    const navAbout = document.querySelector('.nav-about');
    if (navAbout) navAbout.addEventListener('click', () => { closeMenu(); closeSearch(); });

    // 팝업 바깥(메뉴 영역 밖)을 클릭하면 닫기
    document.addEventListener('click', (e) => {
      if (!menuWrap.contains(e.target)) {
        closeMenu();
        closeSearch();
      }
    });

    // ESC로 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
        closeSearch();
        searchToggle.blur();
      }
    });

  </script>
</body>
</html>
